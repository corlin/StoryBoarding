name: Deploy Backend to Cloudflare Workers (US East)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend Worker & Migrate D1 (US East)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Type Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Auto-Provision D1 & R2 on US East and Inject D1 UUID
        working-directory: backend
        run: |
          echo "1. Ensuring D1 Database exists on US East (enam)..."
          npx wrangler d1 create storyboard_db --location=enam || true
          
          echo "2. Ensuring R2 Bucket exists..."
          npx wrangler r2 bucket create storyboard-assets || true

          DB_UUID="${CLOUDFLARE_D1_DATABASE_ID}"

          if [ -z "$DB_UUID" ]; then
            echo "3. Querying actual D1 Database UUID from Cloudflare API..."
            DB_UUID=$(npx wrangler d1 list --json 2>/dev/null | node -e "
              const fs = require('fs');
              try {
                const list = JSON.parse(fs.readFileSync(0, 'utf-8'));
                const db = Array.isArray(list) ? list.find(d => d.name === 'storyboard_db') : null;
                if (db && db.uuid) {
                  process.stdout.write(db.uuid);
                }
              } catch (e) {}
            " || true)
          fi

          echo "Detected D1 UUID: [$DB_UUID]"

          if [ -n "$DB_UUID" ]; then
            echo "Injecting real database_id into wrangler.toml..."
            node -e "
              const fs = require('fs');
              let toml = fs.readFileSync('wrangler.toml', 'utf-8');
              toml = toml.replace(/database_id\s*=\s*\"[^\"]*\"/, 'database_id = \"$DB_UUID\"');
              fs.writeFileSync('wrangler.toml', toml, 'utf-8');
            "
            echo "Updated wrangler.toml D1 binding configuration."
          fi

      - name: Apply D1 Database Migrations (US East)
        working-directory: backend
        run: |
          echo "Applying schema migrations to remote D1..."
          npx wrangler d1 execute storyboard_db --remote --file=drizzle/migrations/0000_initial.sql --yes || true

      - name: Deploy Worker to Cloudflare Edge
        working-directory: backend
        run: |
          echo "Deploying Cloudflare Worker..."
          npx wrangler deploy --minify
