name: Deploy Backend to Cloudflare Workers (US East)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend Worker & Migrate D1 (US East)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Type Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Initialize D1 Database & R2 Bucket (US East / enam)
        working-directory: backend
        run: |
          echo "Ensuring D1 Database exists on US East..."
          npx wrangler d1 create storyboard_db --location=enam || true
          echo "Ensuring R2 Bucket exists..."
          npx wrangler r2 bucket create storyboard-assets || true

      - name: Apply D1 Database Migrations (US East)
        working-directory: backend
        run: |
          echo "Applying initial schema to remote D1 database..."
          npx wrangler d1 execute storyboard_db --remote --file=drizzle/migrations/0000_initial.sql --yes || true

      - name: Deploy Worker to Cloudflare Edge
        working-directory: backend
        run: |
          echo "Deploying Cloudflare Worker..."
          npx wrangler deploy --minify
